<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>xStocks Points Airdrop Calculator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: #0a0a0a;
      color: #e5e5e5;
      min-height: 100vh;
      padding: 30px 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container {
      max-width: 1100px;
      width: 100%;
    }

    /* Header con logos */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .logo-xstock {
      height: 42px;
      width: auto;
      object-fit: contain;
    }

    .logo-dc {
      height: 42px;
      width: 42px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #333;
      transition: opacity 0.2s;
    }

    .logo-dc:hover {
      opacity: 0.8;
    }

    h1 {
      text-align: center;
      font-size: 42px;
      font-weight: 800;
      margin-bottom: 12px;
      color: #fff;
      line-height: 1.15;
    }

    .register-boost {
      text-align: center;
      margin-bottom: 32px;
      font-size: 15px;
    }

    .register-boost a {
      color: #2dd4bf;
      text-decoration: none;
      font-weight: 600;
    }

    .register-boost a:hover {
      text-decoration: underline;
    }

    .main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    @media (max-width: 800px) {
      .main {
        grid-template-columns: 1fr;
      }
      h1 {
        font-size: 32px;
      }
      .logo-xstock {
        height: 34px;
      }
      .logo-dc {
        height: 34px;
        width: 34px;
      }
    }

    .card {
      background: #141414;
      border: 1px solid #222;
      border-radius: 16px;
      padding: 24px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      color: #aaa;
      margin-bottom: 18px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    label {
      display: block;
      font-size: 15px;
      font-weight: 600;
      color: #e5e5e5;
      margin-bottom: 8px;
    }

    .fixed-points {
      font-size: 26px;
      font-weight: 700;
      color: #2dd4bf;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .points-source {
      font-size: 12px;
      color: #666;
      margin-bottom: 22px;
    }

    input[type="text"] {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 12px 14px;
      color: #fff;
      font-size: 16px;
      outline: none;
      transition: border 0.2s;
      margin-bottom: 20px;
    }

    input[type="text"]:focus {
      border-color: #2dd4bf;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }

    .btn {
      background: #1f1f1f;
      border: 1px solid #333;
      color: #ccc;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.15s;
    }

    .btn:hover {
      background: #2a2a2a;
    }

    .btn.active {
      background: #2dd4bf;
      color: #000;
      border-color: #2dd4bf;
      font-weight: 600;
    }

    /* Resultados principales */
    .main-result {
      background: #0f0f0f;
      border-radius: 16px;
      padding: 30px 20px;
      text-align: center;
      margin-bottom: 24px;
    }

    .main-result-label {
      font-size: 14px;
      color: #888;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .main-result-value {
      font-size: 42px;
      font-weight: 700;
      color: #2dd4bf;
      margin-bottom: 20px;
    }

    .details {
      display: flex;
      justify-content: center;
      gap: 40px;
      flex-wrap: wrap;
      font-size: 14px;
      color: #aaa;
    }

    .detail-item {
      text-align: center;
    }

    .detail-label {
      font-size: 12px;
      color: #666;
      margin-bottom: 4px;
    }

    .detail-value {
      font-size: 16px;
      color: #fff;
      font-weight: 500;
    }
