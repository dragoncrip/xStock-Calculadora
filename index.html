<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Airdrop Calculator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            dark: '#0b0f19',
            card: '#111827',
            border: '#1f2937',
          }
        }
      }
    }
  </script>
  <style>
    body { background: #0b0f19; }
    .btn-preset {
      @apply px-3 py-1.5 rounded-lg text-sm font-medium border border-gray-700 bg-gray-800 hover:bg-gray-700 transition cursor-pointer;
    }
    .btn-preset.active {
      @apply bg-indigo-600 border-indigo-500 text-white;
    }
  </style>
</head>
<body class="text-gray-100 min-h-screen">
  <div class="max-w-3xl mx-auto px-4 py-10">

    <!-- Header -->
    <div class="text-center mb-10">
      <h1 class="text-3xl md:text-4xl font-bold tracking-tight">Airdrop → TGE Estimator</h1>
      <p class="text-gray-400 mt-2 text-sm">Calcula cuánto valdría tu airdrop según puntos, % de supply y FDV</p>
    </div>

    <!-- Tu Allocation (arriba) -->
    <div class="bg-card border border-border rounded-2xl p-6 mb-6">
      <h2 class="text-lg font-semibold mb-4">Tus puntos</h2>
      <input id="myPoints" type="number" value="0" step="1"
             class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
             oninput="calcular()" placeholder="Escribe tus puntos exactos">
    </div>

    <!-- Global Assumptions -->
    <div class="bg-card border border-border rounded-2xl p-6 mb-6">
      <h2 class="text-lg font-semibold mb-4">Global Assumptions</h2>

      <!-- Puntos totales (fijo, solo lectura) -->
      <div class="mb-6">
        <div class="flex justify-between items-center mb-1">
          <label class="text-sm text-gray-400">Puntos totales distribuidos</label>
          <span id="lastUpdate" class="text-xs text-gray-500"></span>
        </div>
        <input id="totalPoints" type="text" value="13.93B" readonly
               class="w-full bg-gray-900/70 border border-gray-700 rounded-xl px-4 py-3 text-gray-300 cursor-not-allowed">
        <p class="text-xs text-gray-500 mt-1.5">Se actualiza automáticamente cada hora desde xpoints.io</p>
      </div>

      <!-- % del Supply -->
      <div class="mb-6">
        <label class="text-sm text-gray-400 mb-2 block">% del Supply destinado al airdrop</label>
        <div class="flex flex-wrap gap-2">
          <button class="btn-preset" onclick="setPercent(5)">5%</button>
          <button class="btn-preset active" onclick="setPercent(10)">10%</button>
          <button class="btn-preset" onclick="setPercent(15)">15%</button>
          <button class="btn-preset" onclick="setPercent(20)">20%</button>
          <button class="btn-preset" onclick="setPercent(25)">25%</button>
        </div>
        <input id="percent" type="hidden" value="10">
      </div>

      <!-- FDV -->
      <div>
        <label class="text-sm text-gray-400 mb-2 block">FDV (Fully Diluted Valuation)</label>
        <div class="flex flex-wrap gap-2">
          <button class="btn-preset" onclick="setFDV(50)">$50M</button>
          <button class="btn-preset" onclick="setFDV(100)">$100M</button>
          <button class="btn-preset" onclick="setFDV(250)">$250M</button>
          <button class="btn-preset active" onclick="setFDV(500)">$500M</button>
          <button class="btn-preset" onclick="setFDV(1000)">$1.000M</button>
          <button class="btn-preset" onclick="setFDV(2000)">$2.000M</button>
        </div>
        <input id="fdv" type="hidden" value="500">
      </div>
    </div>

    <!-- Resultado principal -->
    <div class="bg-gradient-to-br from-indigo-900/40 to-purple-900/20 border border-indigo-500/30 rounded-2xl p-6 text-center mb-6">
      <p class="text-sm text-gray-400">Estimated Value at TGE</p>
      <p id="valor" class="text-4xl md:text-5xl font-bold text-indigo-300 mt-1">$0.00</p>
      <div class="mt-4 text-sm">
        <p class="text-gray-400">Pool share</p>
        <p id="share" class="font-medium text-lg">0.0000%</p>
      </div>
    </div>

    <!-- Tabla de escenarios -->
    <div class="bg-card border border-border rounded-2xl p-6 overflow-x-auto">
      <h2 class="text-lg font-semibold mb-4">Escenarios por FDV</h2>
      <table class="w-full text-sm">
        <thead>
          <tr class="text-gray-400 border-b border-gray-700">
            <th class="text-left py-2">FDV</th>
            <th class="text-right py-2">Token Price</th>
            <th class="text-right py-2">Tu Valor</th>
          </tr>
        </thead>
        <tbody id="tabla" class="divide-y divide-gray-800">
        </tbody>
      </table>
    </div>

  </div>

  <script>
    const TOTAL_SUPPLY = 1_000_000_000;
    let totalPointsRaw = 13930000000; // valor por defecto

    function setPercent(val) {
      document.getElementById('percent').value = val;
      document.querySelectorAll('.btn-preset').forEach(b => {
        if (b.textContent.includes('%')) b.classList.remove('active');
      });
      event.target.classList.add('active');
      calcular();
    }

    function setFDV(val) {
      document.getElementById('fdv').value = val;
      document.querySelectorAll('.btn-preset').forEach(b => {
        if (b.textContent.includes('$')) b.classList.remove('active');
      });
      event.target.classList.add('active');
      calcular();
    }

    function formatMoney(n) {
      if (n >= 1_000_000) return '$' + (n / 1_000_000).toFixed(2) + 'M';
      if (n >= 1_000) return '$' + (n / 1_000).toFixed(1) + 'K';
      return '$' + n.toFixed(2);
    }

    function formatNumber(n) {
      return new Intl.NumberFormat('en-US', { maximumFractionDigits: 0 }).format(n);
    }

    function calcular() {
      const myPoints = parseFloat(document.getElementById('myPoints').value) || 0;
      const percent = parseFloat(document.getElementById('percent').value) || 0;
      const fdvMillions = parseFloat(document.getElementById('fdv').value) || 0;
      const fdv = fdvMillions * 1_000_000;

      const airdropTokens = (percent / 100) * TOTAL_SUPPLY;
      const tokenPrice = fdv / TOTAL_SUPPLY;
      const share = totalPointsRaw > 0 ? myPoints / totalPointsRaw : 0;
      const myTokens = share * airdropTokens;
      const myValue = myTokens * tokenPrice;

      document.getElementById('valor').textContent = formatMoney(myValue);
      document.getElementById('share').textContent = (share * 100).toFixed(4) + '%';

      // Tabla
      const scenarios = [50, 100, 250, 500, 1000, 2000];
      let html = '';
      scenarios.forEach(m => {
        const f = m * 1_000_000;
        const price = f / TOTAL_SUPPLY;
        const val = myTokens * price;
        const isCurrent = m === fdvMillions;
        const label = m >= 1000 ? (m/1000) + '.000M' : m + 'M';
        html += `
          <tr class="${isCurrent ? 'bg-indigo-900/20' : ''}">
            <td class="py-3 font-medium">$${label}</td>
            <td class="py-3 text-right">$${price.toFixed(4)}</td>
            <td class="py-3 text-right font-medium text-indigo-300">${formatMoney(val)}</td>
          </tr>`;
      });
      document.getElementById('tabla').innerHTML = html;
    }

    // Actualización automática cada hora
    async function actualizarPuntos() {
      const lastUpdate = document.getElementById('lastUpdate');
      const input = document.getElementById('totalPoints');
      
      try {
        lastUpdate.textContent = "actualizando...";
        
        const response = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent('https://xpoints.io/'));
        const html = await response.text();
        
        // Buscamos el número de Total points
        const match = html.match(/Total points[\s\S]{0,50}?([\d,]+)/i);
        
        if (match && match[1]) {
          totalPointsRaw = parseInt(match[1].replace(/,/g, ''));
          const enBillones = (totalPointsRaw / 1_000_000_000).toFixed(2);
          
          input.value = enBillones + 'B';
          
          const ahora = new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
          lastUpdate.textContent = `actualizado ${ahora}`;
          calcular();
        } else {
          lastUpdate.textContent = "usando valor guardado";
        }
      } catch (error) {
        console.error(error);
        lastUpdate.textContent = "usando valor guardado";
      }
    }

    // Al cargar
    actualizarPuntos();
    setInterval(actualizarPuntos, 60 * 60 * 1000);
    calcular();
  </script>
</body>
</html>
