<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Airdrop Calculator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0b0f19; }
    .btn-preset {
      @apply px-3 py-1.5 rounded-lg text-sm font-medium border border-gray-700 bg-gray-800 hover:bg-gray-700 transition cursor-pointer;
    }
    .btn-preset.active {
      @apply bg-indigo-600 border-indigo-500 text-white;
    }
  </style>
</head>
<body class="text-gray-100 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md space-y-5">

    <!-- Card principal -->
    <div class="bg-[#111827] border border-gray-800 rounded-2xl p-6 shadow-2xl">

      <!-- Header -->
      <div class="mb-6">
        <h1 class="text-xl font-bold">TGE is coming</h1>
        <p class="text-sm text-gray-400 mt-1">
          Puntos totales distribuidos 
          <span id="totalPointsLabel" class="text-indigo-400 font-semibold">13.93B</span>
        </p>
        <p id="lastUpdate" class="text-xs text-gray-500 mt-1"></p>
      </div>

      <!-- Tus puntos -->
      <div class="mb-5">
        <label class="block text-sm text-gray-400 mb-1.5">Your Points</label>
        <input id="myPoints" type="number" value="0" 
               class="w-full bg-[#0b0f19] border border-gray-700 rounded-xl px-4 py-3 text-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
               oninput="calcular()" placeholder="0">
      </div>

      <!-- FDV -->
      <div class="mb-5">
        <label class="block text-sm text-gray-400 mb-2">FDV</label>
        <div class="flex flex-wrap gap-2">
          <button class="btn-preset" onclick="setFDV(50)">$50M</button>
          <button class="btn-preset" onclick="setFDV(100)">$100M</button>
          <button class="btn-preset" onclick="setFDV(250)">$250M</button>
          <button class="btn-preset active" onclick="setFDV(500)">$500M</button>
          <button class="btn-preset" onclick="setFDV(1000)">$1B</button>
          <button class="btn-preset" onclick="setFDV(2000)">$2B</button>
        </div>
        <input id="fdv" type="hidden" value="500">
      </div>

      <!-- Airdrop pool % -->
      <div class="mb-6">
        <label class="block text-sm text-gray-400 mb-2">Airdrop pool %</label>
        <div class="flex flex-wrap gap-2">
          <button class="btn-preset" onclick="setPercent(5)">5%</button>
          <button class="btn-preset active" onclick="setPercent(10)">10%</button>
          <button class="btn-preset" onclick="setPercent(15)">15%</button>
          <button class="btn-preset" onclick="setPercent(20)">20%</button>
          <button class="btn-preset" onclick="setPercent(25)">25%</button>
        </div>
        <input id="percent" type="hidden" value="10">
      </div>

      <!-- Resultado principal -->
      <div class="bg-gradient-to-br from-indigo-900/30 to-purple-900/20 border border-indigo-500/20 rounded-xl p-5 text-center">
        <p class="text-sm text-gray-400">Estimated Value at TGE</p>
        <p id="valor" class="text-3xl font-bold text-indigo-300 mt-1">$0.00</p>
        <p class="text-sm text-gray-400 mt-3">Pool share</p>
        <p id="share" class="font-medium">0.0000%</p>
      </div>
    </div>

    <!-- 3 Escenarios fijos -->
    <div class="bg-[#111827] border border-gray-800 rounded-2xl p-5">
      <h3 class="text-sm font-semibold text-gray-300 mb-4">Escenarios</h3>
      
      <div class="space-y-3">
        <!-- FUD -->
        <div class="flex justify-between items-center bg-red-900/20 border border-red-800/40 rounded-xl px-4 py-3">
          <div>
            <p class="font-medium text-red-400">FUD</p>
            <p class="text-xs text-gray-500">5% supply · $100M FDV</p>
          </div>
          <p id="fudValue" class="text-lg font-bold text-red-300">$0</p>
        </div>

        <!-- NORMAL -->
        <div class="flex justify-between items-center bg-yellow-900/20 border border-yellow-800/40 rounded-xl px-4 py-3">
          <div>
            <p class="font-medium text-yellow-400">NORMAL</p>
            <p class="text-xs text-gray-500">10% supply · $500M FDV</p>
          </div>
          <p id="normalValue" class="text-lg font-bold text-yellow-300">$0</p>
        </div>

        <!-- FOMO -->
        <div class="flex justify-between items-center bg-green-900/20 border border-green-800/40 rounded-xl px-4 py-3">
          <div>
            <p class="font-medium text-green-400">FOMO</p>
            <p class="text-xs text-gray-500">20% supply · $1B FDV</p>
          </div>
          <p id="fomoValue" class="text-lg font-bold text-green-300">$0</p>
        </div>
      </div>
    </div>

  </div>

  <script>
    const TOTAL_SUPPLY = 1_000_000_000;
    let totalPointsRaw = 13930000000;

    function setPercent(val) {
      document.getElementById('percent').value = val;
      document.querySelectorAll('.btn-preset').forEach(b => {
        if (b.textContent.includes('%')) b.classList.remove('active');
      });
      event.target.classList.add('active');
      calcular();
    }

    function setFDV(val) {
      document.getElementById('fdv').value = val;
      document.querySelectorAll('.btn-preset').forEach(b => {
        if (b.textContent.includes('$')) b.classList.remove('active');
      });
      event.target.classList.add('active');
      calcular();
    }

    function formatMoney(n) {
      if (n >= 1_000_000) return '$' + (n / 1_000_000).toFixed(2) + 'M';
      if (n >= 1_000) return '$' + (n / 1_000).toFixed(1) + 'K';
      return '$' + n.toFixed(2);
    }

    function calcularEscenario(percent, fdvMillions) {
      const myPoints = parseFloat(document.getElementById('myPoints').value) || 0;
      const fdv = fdvMillions * 1_000_000;
      const airdropTokens = (percent / 100) * TOTAL_SUPPLY;
      const tokenPrice = fdv / TOTAL_SUPPLY;
      const share = totalPointsRaw > 0 ? myPoints / totalPointsRaw : 0;
      const myTokens = share * airdropTokens;
      return myTokens * tokenPrice;
    }

    function calcular() {
      const myPoints = parseFloat(document.getElementById('myPoints').value) || 0;
      const percent = parseFloat(document.getElementById('percent').value) || 0;
      const fdvMillions = parseFloat(document.getElementById('fdv').value) || 0;
      const fdv = fdvMillions * 1_000_000;

      const airdropTokens = (percent / 100) * TOTAL_SUPPLY;
      const tokenPrice = fdv / TOTAL_SUPPLY;
      const share = totalPointsRaw > 0 ? myPoints / totalPointsRaw : 0;
      const myTokens = share * airdropTokens;
      const myValue = myTokens * tokenPrice;

      // Resultado principal
      document.getElementById('valor').textContent = formatMoney(myValue);
      document.getElementById('share').textContent = (share * 100).toFixed(4) + '%';

      // Escenarios fijos
      document.getElementById('fudValue').textContent = formatMoney(calcularEscenario(5, 100));
      document.getElementById('normalValue').textContent = formatMoney(calcularEscenario(10, 500));
      document.getElementById('fomoValue').textContent = formatMoney(calcularEscenario(20, 1000));
    }

    // Actualización automática de puntos totales
    async function actualizarPuntos() {
      const label = document.getElementById('totalPointsLabel');
      const lastUpdate = document.getElementById('lastUpdate');
      
      try {
        lastUpdate.textContent = "actualizando...";
        
        const response = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent('https://xpoints.io/'));
        const html = await response.text();
        
        const match = html.match(/Total points[\s\S]{0,80}?([\d,]+)/i);
        
        if (match && match[1]) {
          totalPointsRaw = parseInt(match[1].replace(/,/g, ''));
          
          if (totalPointsRaw >= 1_000_000_000) {
            label.textContent = (totalPointsRaw / 1_000_000_000).toFixed(2) + 'B';
          } else {
            label.textContent = (totalPointsRaw / 1_000_000).toFixed(1) + 'M';
          }
          
          const ahora = new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
          lastUpdate.textContent = `Actualizado ${ahora}`;
          calcular();
        } else {
          lastUpdate.textContent = "usando valor guardado";
        }
      } catch (e) {
        lastUpdate.textContent = "usando valor guardado";
      }
    }

    // Iniciar
    actualizarPuntos();
    setInterval(actualizarPuntos, 60 * 60 * 1000);
    calcular();
  </script>
</body>
</html>
